[package]
name = "glumy"
version = "1.1.0"
edition = "2024"
description = "A lightweight graphics abstraction layer built on wgpu and winit."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PsychoRosse/glumy"
readme = "README.md"
keywords = ["graphics", "wgpu"]
categories = ["game-development"]

[lib]
path = "glumy-core/_lib.rs"

[dependencies]
wgpu = { version = "30.0.1" }
winit = { version = "0.31.0-beta.4" }
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = { version = "1.0.1" }
bitflags = { version = "2.13.1" }
thiserror = { version = "2.0.21" }
raw-window-handle = { version = "0.6.2" }

plam = { version = "0.2.0" }


serde = { version = "1.0.229", features = ["derive"], optional = true }
clama = { version = "0.1.0", optional = true }

[features]
default = ["serde", "clama"]
serde = ["dep:serde"]
clama = ["dep:clama"]
