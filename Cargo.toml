[package]
name = "glumy"
version = "1.1.0"
edition = "2024"
description = "A lightweight, ergonomic windowing abstraction built on winit."
license = "MIT OR Apache-2.0"
repository = "https://github.com/PsychoRosse/glumy"
readme = "README.md"
keywords = ["graphics", "winit"]
categories = ["game-development"]

[[bin]]
name = "glumy"
path = "glumy-sandbox/src/main.rs"

[lib]
path = "glumy-hell/src/_lib.rs"

[dependencies]
plam = { git = "https://github.com/PsychoRosse/plam" }
clama = { git = "https://github.com/PsychoRosse/clama" }

winit = { version = "0.31.0-beta.4" }
thiserror = { version = "2.0.21" }
raw-window-handle = { version = "0.6.2" }

serde = { version = "1.0.229", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]
